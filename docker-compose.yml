services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: plent
      POSTGRES_PASSWORD: plent
      POSTGRES_DB: plent
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U plent -d plent']
      interval: 2s
      timeout: 5s
      retries: 15

  migrate:
    image: node:26-alpine
    working_dir: /app
    command: sh -c 'npm ci && npm run db:migrate'
    environment:
      DATABASE_URL: postgres://plent:plent@postgres:5432/plent
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
